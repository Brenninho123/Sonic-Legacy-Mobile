name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Install dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install hxvlc --quiet
          haxelib git linc_luajit https://github.com/MAJigsaw77/linc_luajit
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools
          haxelib list

      - name: Configure Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        run: haxelib run lime build android -release -arm64 -armv7 -Dofficial

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find export -name "*.apk" | head -n 1)
          keytool -genkeypair -keystore ci.keystore -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ci.keystore --ks-pass pass:android --key-pass pass:android --out FNFRodentrap.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNFRodentrap-android
          path: FNFRodentrap.apk
          if-no-files-found: error
